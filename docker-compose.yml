# ─────────────────────────────────────────────────────────────
# جيل العمل / Jeel Alamal — DEVELOPMENT stack
# Three services + Adminer, hot-reload via bind mounts.
#   docker compose up --build
# ─────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:17-alpine
    container_name: jeel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jeel_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: jeel_backend
    restart: unless-stopped
    # Run pending migrations + idempotent seed, then start the dev server.
    command: sh -c "npm run migration:run && npm run seed && npm run start:dev"
    environment:
      NODE_ENV: development
      BACKEND_PORT: 3001
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      UPLOADS_DIR: /app/uploads
    ports:
      - '${BACKEND_PORT:-3001}:3001'
    volumes:
      # Bind-mount source for hot reload; keep container's node_modules.
      - ./backend:/app
      - /app/node_modules
      # Persist uploaded files (institute logos, etc.).
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jeel_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: jeel_frontend
    restart: unless-stopped
    # NEXT_PUBLIC_API_URL is intentionally unset in dev: the browser derives the
    # backend URL from the page's own hostname (see frontend/src/lib/api.ts), so
    # the app works from the PC (localhost) and from a phone on the same Wi-Fi
    # (the host's LAN IP) without hardcoding an address.
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - jeel_net

  adminer:
    image: adminer:latest
    container_name: jeel_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - db
    networks:
      - jeel_net

volumes:
  pgdata:
  uploads:

networks:
  jeel_net:
    driver: bridge
